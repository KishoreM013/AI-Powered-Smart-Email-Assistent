# Render blueprint for the FastAPI backend.
#
# The disk matters: the app stores analysed mail in SQLite, and Render's free
# tier has no persistent volume, so every spin-down would wipe the database.
# A paid service with a disk is required.
services:
  - type: web
    name: smart-email-backend
    runtime: python
    plan: starter            # paid: the free tier cannot hold a disk
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: email-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # ---- required: supply the real values in the Render dashboard ----
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ---- configuration ----
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "False"
      - key: STORAGE_PATH
        value: /data/smart_email.db
      - key: FRONTEND_URL
        sync: false            # https://<your-vercel-app>.vercel.app
      - key: CORS_ORIGINS
        sync: false            # ["https://<your-vercel-app>.vercel.app"]
      - key: GOOGLE_REDIRECT_URI
        sync: false            # https://<backend>.onrender.com/api/auth/google/callback
